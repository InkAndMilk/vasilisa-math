<script>
'use strict';
(()=>{
 const data=JSON.parse(document.querySelector('#encrypted-data').textContent);
 const STORAGE_KEY='vasilisa_unlock_key_v1';
 const input=document.querySelector('#password');
 const form=document.querySelector('#unlock');
 const submit=document.querySelector('#submit');
 const error=document.querySelector('#error');
 const remember=document.querySelector('#remember');
 const eye=document.querySelector('#visibility');
 const b64bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const bytesb64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
 function message(txt){error.textContent=txt;}
 function storageRemove(){try{localStorage.removeItem(STORAGE_KEY);}catch(e){}}
 function storageRead(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(e){return null;}}
 function storageSave(bytes){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({key:bytesb64(bytes),expires:Date.now()+30*86400000}));}catch(e){}}
 async function decrypt(key){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(data.iv)},key,b64bytes(data.ciphertext));
  return new TextDecoder().decode(plain);
 }
 function openGame(page){document.open();document.write(page);document.close();}
 async function unlockPassword(password){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64bytes(data.salt),iterations:data.iterations},material,{name:'AES-GCM',length:256},true,['decrypt']);
  const page=await decrypt(key);
  // Save the remembered key before replacing the document (important for Safari/iOS PWA).
  if(remember.checked){storageSave(await crypto.subtle.exportKey('raw',key));}else{storageRemove();}
  openGame(page);
 }
 async function tryAuto(){
  if(new URL(location.href).searchParams.has('locked'))return;
  const old=storageRead();if(!old||old.expires<Date.now()||!old.key){storageRemove();return;}
  try{const key=await crypto.subtle.importKey('raw',b64bytes(old.key),{name:'AES-GCM',length:256},false,['decrypt']);const page=await decrypt(key);openGame(page);}
  catch(e){storageRemove();message('Введите пароль для входа.');}
 }
 eye.addEventListener('click',()=>{const hidden=input.type==='password';input.type=hidden?'text':'password';eye.setAttribute('aria-label',hidden?'Скрыть пароль':'Показать пароль');});
 form.addEventListener('submit',async e=>{
  e.preventDefault();message('');
  if(!globalThis.crypto||!crypto.subtle){message('Для защиты нужен HTTPS. Открой игру по опубликованной ссылке, а не из файла.');return;}
  const password=input.value;
  if(!password.trim()){message('Введите семейный пароль.');return;}
  submit.disabled=true;submit.textContent='Открываем…';
  try{await unlockPassword(password);}
  catch(e){message('Пароль не подошёл. Попробуй ещё раз.');submit.disabled=false;submit.textContent='Открыть экспедицию →';}
 });
 if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
 if(globalThis.crypto && crypto.subtle){tryAuto();}else{message('Для работы нужен HTTPS или localhost.');}
})();
</script>
